services:
  frontend:
    image: bloglist-frontend-prod
    build:
      context: ./client
      dockerfile: Dockerfile

  backend:
    image: bloglist-backend-prod
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://root:example@mongo:27017/bloglist?authSource=admin
    depends_on:
      - mongo

  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=bloglist
    volumes:
      - bloglist-mongo-data:/data/db

  nginx:
    image: nginx:1.29-alpine
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  bloglist-mongo-data: